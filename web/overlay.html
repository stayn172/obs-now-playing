<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/overlay.css">
</head>
<body>
<div id="stage">
  <div id="card" class="hidden" data-align="left">
    <div class="bg">
      <div class="bg-arts"><div class="bg-art"></div><div class="bg-art"></div></div>
      <div class="bg-tint"></div>
    </div>
    <div class="content">
      <div class="art"><img alt=""><img alt=""></div>
      <div class="info">
        <div class="text">
          <div class="label"></div>
          <div class="line title"><span class="track"></span></div>
          <div class="line artist"><span class="track"></span></div>
          <div class="line album"><span class="track"></span></div>
        </div>
        <div class="timeline">
          <div class="times"><span class="elapsed">0:00</span><span class="remaining">-0:00</span></div>
          <div class="bar"><div class="fill"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/assets/overlay.js"></script>
</body>
</html>
